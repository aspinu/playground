
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendings Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://unpkg.com/htmx.org@1.9.2" integrity="sha384-L6OqL9pRWyyFU3+/bjdSri+iIphTN/bvYyM37tICVyOJkWZLpP2vGn6VUEXgzg6h" crossorigin="anonymous"></script>


</head>
<body>
<div class="container" id="content">
<div class="col-4">
<form hx-post="/auth-login/" hx-trigger="click" hx-swap="innerHTML">
 
  <div class="mb-3 mt-3">
    <label for="username" class="form-label">Username:</label>
    <input type="username" class="form-control" id="username" placeholder="Enter username" name="password">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password:</label>
    <input type="password" class="form-control" id="password" placeholder="Enter password" name="password">
  </div>
       <button htype="button" class="btn btn-primary" hx-get="/home" hx-trigger="click" hx-swap="innerHTML" hx-target="#content" >Register</button>
 </form>
          <!-- </formy" hx-get="/" hx-trigger="click" hx-target="#content" hx-swap="innerHTML">Register</button>> -->
  <button htype="button" class="btn btn-primary" hx-get="/home" hx-trigger="click" hx-target="#content" hx-swap="innerHTML">Login</button>
</div>
</div>
</body>
</html>
